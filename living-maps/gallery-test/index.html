<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #080808;
    --surface: #111111;
    --ink:     #f2ede4;
    --ink-dim: rgba(242,237,228,0.45);
    --amber:   #c49a3c;
    --amber-dim: rgba(196,154,60,0.6);
  }

  html { background: var(--bg); }

  body {
    font-family: 'Cormorant Garamond', Georgia, serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }

  /* Grain */
  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 999;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  /* ── Header ── */
  header {
    padding: 3rem 4rem 2rem;
    display: flex;
    align-items: baseline;
    gap: 2rem;
  }
  header h1 {
    font-size: clamp(2rem, 4vw, 3.2rem);
    font-weight: 300;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  header h1 em {
    font-style: italic;
    color: var(--amber);
  }
  header p {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    font-weight: 300;
    color: var(--ink-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding-top: 0.35rem;
  }

  /* ── Grid ── */
  .gallery {
    columns: 3 280px;
    column-gap: 3px;
    padding: 0 3px 3px;
  }

  .gallery-item {
    break-inside: avoid;
    position: relative;
    overflow: hidden;
    margin-bottom: 3px;
    cursor: pointer;
    display: block;
  }

  .gallery-item img {
    display: block;
    width: 100%;
    height: auto;
    transition: transform 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    filter: brightness(0.88) saturate(0.9);
  }

  .gallery-item:hover img {
    transform: scale(1.04);
    filter: brightness(0.75) saturate(0.85);
  }

  /* Hover overlay */
  .gallery-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 55%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 1.5rem 1.25rem;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .gallery-item:hover .gallery-overlay {
    opacity: 1;
    transform: translateY(0);
  }

  .gallery-category {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 0.3rem;
  }

  .gallery-title {
    font-size: 1.15rem;
    font-weight: 300;
    font-style: italic;
    color: var(--ink);
    line-height: 1.2;
  }

  /* ── Lightbox ── */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }

  .lightbox.open {
    opacity: 1;
    pointer-events: all;
  }

  .lb-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(5, 5, 5, 0.96);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .lb-ui {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    padding: 1.5rem;
  }

  .lb-header {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.5rem 2rem;
  }

  .lb-counter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    font-weight: 300;
    letter-spacing: 0.1em;
    color: var(--ink-dim);
  }

  .lb-close {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--ink-dim);
    font-size: 1.6rem;
    line-height: 1;
    padding: 0.25rem 0.5rem;
    transition: color 0.2s ease;
    font-weight: 300;
  }
  .lb-close:hover { color: var(--ink); }

  .lb-stage {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    width: 100%;
    max-width: 1100px;
  }

  .lb-nav {
    background: none;
    border: 1px solid rgba(242,237,228,0.12);
    color: var(--ink-dim);
    cursor: pointer;
    width: 44px; height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s ease;
    font-size: 1.2rem;
  }
  .lb-nav:hover {
    border-color: var(--amber-dim);
    color: var(--amber);
    background: rgba(196,154,60,0.06);
  }

  .lb-image-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }

  #lb-img {
    max-width: 100%;
    max-height: 72vh;
    width: auto;
    height: auto;
    display: block;
    object-fit: contain;
    transform: scale(0.94);
    opacity: 0;
    transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
    box-shadow: 0 32px 80px rgba(0,0,0,0.6);
  }

  #lb-img.visible {
    opacity: 1;
    transform: scale(1);
  }

  .lb-footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.2rem;
    min-height: 2.8rem;
  }

  .lb-meta-category {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--amber);
  }

  .lb-meta-title {
    font-size: 1.35rem;
    font-weight: 300;
    font-style: italic;
    color: var(--ink);
  }

  /* Progress bar */
  .lb-progress {
    position: absolute;
    bottom: 0; left: 0;
    height: 1px;
    background: var(--amber);
    transition: width 0.35s ease;
  }

  @media (max-width: 640px) {
    header { padding: 2rem 1.25rem 1.5rem; flex-direction: column; gap: 0.5rem; }
    .lb-stage { gap: 0.75rem; }
    .lb-nav { width: 36px; height: 36px; font-size: 1rem; }
    #lb-img { max-height: 60vh; }
  }
</style>
</head>
<body>

<header>
  <h1>Selected <em>Works</em></h1>
  <p>09 images · click to open</p>
</header>

<div class="gallery" id="gallery">
  <div class="gallery-item" data-index="0">
    <img src="https://picsum.photos/seed/g01/800/560" alt="Coastal Light" loading="lazy">
    <div class="gallery-overlay">
      <span class="gallery-category">Landscape</span>
      <span class="gallery-title">Coastal Light</span>
    </div>
  </div>
  <div class="gallery-item" data-index="1">
    <img src="https://picsum.photos/seed/g02/600/820" alt="Still Waters" loading="lazy">
    <div class="gallery-overlay">
      <span class="gallery-category">Abstract</span>
      <span class="gallery-title">Still Waters</span>
    </div>
  </div>
  <div class="gallery-item" data-index="2">
    <img src="https://picsum.photos/seed/g03/800/480" alt="Golden Hour" loading="lazy">
    <div class="gallery-overlay">
      <span class="gallery-category">Portrait</span>
      <span class="gallery-title">Golden Hour</span>
    </div>
  </div>
  <div class="gallery-item" data-index="3">
    <img src="https://picsum.photos/seed/g04/700/700" alt="Urban Geometry" loading="lazy">
    <div class="gallery-overlay">
      <span class="gallery-category">Architecture</span>
      <span class="gallery-title">Urban Geometry</span>
    </div>
  </div>
  <div class="gallery-item" data-index="4">
    <img src="https://picsum.photos/seed/g05/600/780" alt="Forest Floor" loading="lazy">
    <div class="gallery-overlay">
      <span class="gallery-category">Nature</span>
      <span class="gallery-title">Forest Floor</span>
    </div>
  </div>
  <div class="gallery-item" data-index="5">
    <img src="https://picsum.photos/seed/g06/900/560" alt="Soft Exposure" loading="lazy">
    <div class="gallery-overlay">
      <span class="gallery-category">Portrait</span>
      <span class="gallery-title">Soft Exposure</span>
    </div>
  </div>
  <div class="gallery-item" data-index="6">
    <img src="https://picsum.photos/seed/g07/700/460" alt="Desert Wind" loading="lazy">
    <div class="gallery-overlay">
      <span class="gallery-category">Landscape</span>
      <span class="gallery-title">Desert Wind</span>
    </div>
  </div>
  <div class="gallery-item" data-index="7">
    <img src="https://picsum.photos/seed/g08/600/680" alt="Glass & Steel" loading="lazy">
    <div class="gallery-overlay">
      <span class="gallery-category">Architecture</span>
      <span class="gallery-title">Glass & Steel</span>
    </div>
  </div>
  <div class="gallery-item" data-index="8">
    <img src="https://picsum.photos/seed/g09/800/600" alt="Morning Ritual" loading="lazy">
    <div class="gallery-overlay">
      <span class="gallery-category">Still Life</span>
      <span class="gallery-title">Morning Ritual</span>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
  <div class="lb-backdrop" id="lb-backdrop"></div>
  <div class="lb-ui">
    <div class="lb-header">
      <span class="lb-counter" id="lb-counter">01 / 09</span>
      <button class="lb-close" id="lb-close" aria-label="Close">×</button>
    </div>
    <div class="lb-stage">
      <button class="lb-nav" id="lb-prev" aria-label="Previous">‹</button>
      <div class="lb-image-wrap">
        <img id="lb-img" src="" alt="">
      </div>
      <button class="lb-nav" id="lb-next" aria-label="Next">›</button>
    </div>
    <div class="lb-footer">
      <span class="lb-meta-category" id="lb-category"></span>
      <span class="lb-meta-title" id="lb-title"></span>
    </div>
  </div>
  <div class="lb-progress" id="lb-progress"></div>
</div>

<script>
  const items = Array.from(document.querySelectorAll('.gallery-item'));
  const lightbox = document.getElementById('lightbox');
  const lbImg    = document.getElementById('lb-img');
  const lbCounter = document.getElementById('lb-counter');
  const lbCategory = document.getElementById('lb-category');
  const lbTitle  = document.getElementById('lb-title');
  const lbProgress = document.getElementById('lb-progress');
  const total    = items.length;
  let current    = 0;

  const data = items.map(el => ({
    src:      el.querySelector('img').src,
    alt:      el.querySelector('img').alt,
    category: el.querySelector('.gallery-category').textContent,
    title:    el.querySelector('.gallery-title').textContent,
  }));

  function open(index) {
    current = index;
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
    load(index);
  }

  function close() {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
    lbImg.classList.remove('visible');
  }

  function load(index) {
    lbImg.classList.remove('visible');
    const d = data[index];
    lbCounter.textContent = String(index + 1).padStart(2,'0') + ' / ' + String(total).padStart(2,'0');
    lbCategory.textContent = d.category;
    lbTitle.textContent = d.title;
    lbProgress.style.width = ((index + 1) / total * 100) + '%';

    const newImg = new Image();
    newImg.onload = () => {
      lbImg.src = newImg.src;
      lbImg.alt = d.alt;
      requestAnimationFrame(() => requestAnimationFrame(() => lbImg.classList.add('visible')));
    };
    newImg.src = d.src;
  }

  function prev() { current = (current - 1 + total) % total; load(current); }
  function next() { current = (current + 1) % total; load(current); }

  // Open on click
  items.forEach((el, i) => el.addEventListener('click', () => open(i)));

  // Controls
  document.getElementById('lb-close').addEventListener('click', close);
  document.getElementById('lb-backdrop').addEventListener('click', close);
  document.getElementById('lb-prev').addEventListener('click', prev);
  document.getElementById('lb-next').addEventListener('click', next);

  // Keyboard
  document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft')  prev();
    if (e.key === 'ArrowRight') next();
  });

  // Touch swipe
  let touchX = null;
  lightbox.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
  lightbox.addEventListener('touchend', e => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 50) dx < 0 ? next() : prev();
    touchX = null;
  }, { passive: true });
</script>
</body>
</html>
